plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace "io.github.yangyin734.noticeradar"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.yangyin734.noticeradar"
        minSdk 23
        targetSdk 36
        // 由 tools/android-version.mjs 在构建时按 package.json 版本与 CI 运行号改写
        versionCode 1
        versionName "0.8.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            // 单元测试碰到 Android 框架方法时返回默认值而不是抛 Stub!（我们只测纯逻辑）
            // 注意：Groovy DSL 里是 returnDefaultValues，不是 Kotlin DSL 的 isReturnDefaultValues
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // 单元测试（版本号比较、推送结果解析这类纯逻辑必须有测试：它们出错会让用户看到错误的结论）
    testImplementation 'junit:junit:4.13.2'
    // 真实的 org.json（单元测试里 android.jar 的 org.json 是抛 Stub! 的桩，测不了真解析）
    testImplementation 'org.json:json:20240303'
}
