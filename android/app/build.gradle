plugins {
    id 'com.android.application'
}

android {
    namespace "io.github.yangyin734.noticeradar"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.yangyin734.noticeradar"
        minSdk 23
        targetSdk 36
        // 由 tools/android-version.mjs 在构建时按 package.json 版本与 CI 运行号改写
        versionCode 1
        versionName "0.7.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader：把打包进 APK 的网页资源用 https://appassets.androidplatform.net/ 提供，
    // 这样 fetch 与本地存储都有正常的"安全来源"语义（直接用 file:// 会被 CORS 拦住）
    implementation 'androidx.webkit:webkit:1.12.1'
}
