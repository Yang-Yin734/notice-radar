name: poll-math

# 数学科学学院通知：云端抓取（每天一次）
#
# 为什么单独一个工作流、而且一天只跑一次：
#   学院官网部署了瑞数类 JS 机器人挑战，会识别并拒绝**无头**浏览器（实测回 HTTP 400）。
#   所以这里给 runner 挂一个虚拟显示器（Xvfb），跑**真实的、非无头**的 Chrome
#   —— 不是伪造 UA、也不隐藏 navigator.webdriver，就是用一个真的浏览器访问公开页面。
#   但它毕竟是"绕过站点的无头检测"，所以刻意低频：一天一次，不跟着 poll 每 20 分钟打。
#
# 这样安排之后：电脑关着也能收到学院通知（抓取跑在 GitHub 服务器上）。
#
# ⚠ 两地部署开关 —— 境内常驻节点用 Xvfb + 真 Chrome 每 4 小时抓这两个源，
#   它接管学院通知之后，把下面「抓学院通知并推送」那步的 run 加上 --no-notify
#   （这里仍留着，是为了让 docs/ 的仪表盘数据不落后）。详见 deploy/README.md 第 6 步。
on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  # 改配置推上来立刻验证一次，不用等到第二天早上
  push:
    branches: [main]
    paths:
      - '.github/workflows/poll-math.yml'
      - 'config/schools/uestc-math.yaml'
  workflow_dispatch:

concurrency:
  group: poll-math
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 开工前先同步远端（同 poll.yml：产物冲突用 -X ours 以本地为准）
      - name: 同步远端状态
        run: |
          git config merge.ours.driver true
          git fetch origin main
          git merge -X ours --no-edit origin/main || { echo "::warning::同步失败，继续（提交时会再试）"; git merge --abort || true; }

      - name: 准备虚拟显示器与浏览器
        run: |
          # runner 自带 Chrome；xvfb 若缺失则装上
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::runner 上找不到 Chrome/Chromium，无法渲染学院站点"
            exit 1
          fi
          echo "NOTICE_RADAR_BROWSER=$BROWSER" >> "$GITHUB_ENV"
          echo "使用浏览器：$BROWSER"
          xvfb-run --help >/dev/null && echo "xvfb-run 可用"

      - name: 抓学院通知并推送（真实浏览器窗口跑在虚拟显示器里）
        env:
          NOTICE_RADAR_WEBHOOK: ${{ secrets.NOTICE_RADAR_WEBHOOK }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: xvfb-run -a node src/cli.ts run --config=config/schools/uestc-math.yaml --allow-browser --json=data/latest-math.json

      - name: 失败时打印体检表（便于定位）
        if: failure()
        run: xvfb-run -a node src/cli.ts doctor --config=config/schools/uestc-math.yaml --allow-browser || true

      - name: 重建通知归档仪表盘（GitHub Pages）
        run: node src/cli.ts dashboard

      - name: 配置状态推送密钥
        # 同 poll.yml：main 受规则集保护，定时提交用部署密钥推送（白名单成员）。
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          if [ -z "$STATE_DEPLOY_KEY" ]; then
            echo "没有 STATE_DEPLOY_KEY，沿用 GITHUB_TOKEN 推送"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "已改用部署密钥推送"

      - name: 提交状态（下次只报新增）+ 仪表盘
        run: |
          git config user.name "notice-radar-bot"
          git config user.email "notice-radar-bot@users.noreply.github.com"
          git config merge.ours.driver true
          git add -A data docs
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(state): math $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # 先合并远端再推：docs 下是构建产物，冲突必须自动解决（-X ours），
          # 绝不能让 <<<<<<< 这类冲突标记被提交上去（曾经这么坏过线上页面）
          git fetch origin main
          if ! git merge -X ours --no-edit origin/main; then
            git merge --abort || true
            echo "::error::与远端合并失败，本次不提交（下次运行会重试）"
            exit 1
          fi
          if git push; then
            echo "✓ 状态已提交回仓库"
          else
            echo "::error::推送状态失败。查两处：① Settings → Actions → General → Workflow permissions 要为 Read and write；② 若开了 main 保护规则，Secret STATE_DEPLOY_KEY 必须与规则白名单里的部署密钥配对"
            exit 1
          fi
