name: notify-test

# 推送通道测试：只发一条测试消息，不抓任何站点。
# 用途：确认 SERVERCHAN_KEY 这类 secret 配好没有 —— 部署时最容易卡住的就是这一步。
# 结果会写进 data/last-notify.json，所以能从提交记录里直接查证（不必翻 Actions 日志）。
on:
  workflow_dispatch:
  # 本文件或配置变更时自动跑一次，省得手点
  push:
    branches: [main]
    paths:
      - '.github/workflows/notify-test.yml'
      - 'config/schools/uestc.yaml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 发送测试推送
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node src/cli.ts test-notify

      - name: 提交推送结果（便于查证）
        if: always()
        run: |
          git config user.name "notice-radar-bot"
          git config user.email "notice-radar-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "结果无变化"
          else
            git commit -m "chore(notify-test): $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push || echo "::warning::提交推送结果失败（可能 token 只读），但测试结论见上一步输出"
          fi
