name: publish-npm

# 发布到 npm（`npx notice-radar`）。
# 触发方式：
#   - 手动：Actions → publish-npm → Run workflow（可先选 dry-run 只做打包自检）
#   - 打 tag：push v* 标签时自动发（前提是仓库里配了 NPM_TOKEN）
# 没配 NPM_TOKEN 时不会失败，只会提示并做一次 npm pack 自检。
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只做打包自检，不真正发布'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance（供应链签名）

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: 测试
        run: npm test

      - name: 构建（npm 包发的是编译产物 dist/）
        run: npm run build

      - name: 打包自检（永远执行，能提前发现 files 配置漏文件）
        run: |
          # --ignore-scripts：上面已经构建过，这里要的是干净的 JSON 输出
          # （不跳过脚本的话，prepack 的构建日志会和 JSON 混在 stdout 里）
          npm pack --dry-run --ignore-scripts 2>&1 | tail -25
          echo "--- 包内关键文件 ---"
          npm pack --json --ignore-scripts | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const info=JSON.parse(s)[0];
              const files=info.files.map(f=>f.path);
              const need=['dist/cli.js','dist/core/history.js','config/schools/uestc.yaml','config/schools/registry.json','package.json'];
              let bad=0;
              for(const n of need){const ok=files.includes(n);if(!ok)bad++;console.log((ok?'  ✓ ':'  ✗ 缺 ')+n);}
              const leak=files.filter(f=>/^(src\/|tests\/|tools\/|data\/|docs\/|android\/|\.env)/.test(f));
              console.log(leak.length?('  ✗ 不该带：'+leak.slice(0,5).join(', ')):'  ✓ 没带源码/测试/文档/数据等无关文件');
              if(leak.length)bad++;
              console.log('  共 '+files.length+' 个文件，压缩后 '+Math.round(info.size/1024)+' KB，解包 '+Math.round(info.unpackedSize/1024)+' KB');
              process.exit(bad?1:0);
            });
          "

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::仓库里没配 NPM_TOKEN，跳过真实发布。配置方法见 docs/publish.md"
            exit 0
          fi
          # 安全默认：手动触发只有把 dry-run 明确设为 false 才真正发布；打 tag 才默认真发
          if [ "${{ github.event_name }}" = "push" ]; then
            DRY=false
          else
            DRY="${{ inputs.dry-run }}"
          fi
          if [ "$DRY" != "false" ]; then
            echo "▸ dry-run：只验证发布流程（要真发请把 dry-run 设为 false，或打 v* 标签）"
            npm publish --dry-run --provenance --ignore-scripts
            exit 0
          fi
          echo "▸ 正式发布 ${GITHUB_REF_NAME}"
          npm publish --provenance --access public --ignore-scripts
          echo "### 已发布到 npm" >> "$GITHUB_STEP_SUMMARY"
          echo "安装：\`npx notice-radar --help\`" >> "$GITHUB_STEP_SUMMARY"
