name: android-apk

# 把 PWA 打包成**可以直接下载安装的 Android APK**（TWA：Trusted Web Activity —— 套壳的原生应用，
# 打开的就是同一个网页，但会出现在桌面图标列表里，点开即用，不需要手动"添加到主屏幕"）。
#
# 为什么在 CI 里打：本地要装 JDK + Android SDK（1GB+），runner 上现成。
# 为什么不在 CI 里 bubblewrap init：init 全是交互式提问（Domain/URL path/图标…），
# 没有 TTY 会崩。所以工程在本地 init 一次后提交到 android/，CI 只负责构建 + 签名。
# 签名密钥来自 Secrets：同一把密钥才能覆盖安装（见 tools/make-android-keystore.mjs）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: 准备签名密钥
        run: |
          mkdir -p android-signing
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-signing/notice-radar.p12
          echo "keystore 大小：$(stat -c%s android-signing/notice-radar.p12) 字节"
          keytool -list -keystore android-signing/notice-radar.p12 -storetype PKCS12 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | tail -2

      - name: 安装 bubblewrap
        run: npm install -g @bubblewrap/cli

      # 不写这个配置，bubblewrap 会交互式问"要不要由它安装 JDK"，CI 里会直接崩。
      # 另外 bubblewrap 只认 $SDK/tools 或 $SDK/bin（并从这里找 sdkmanager），
      # 而现代 Android SDK 布局里这两个目录都不存在（命令行工具在 cmdline-tools/latest/bin），
      # 不补一个软链它会一直说 "The provided androidSdk isn't correct."
      - name: 预置 bubblewrap 配置 + 补齐它要求的 SDK 结构
        run: |
          echo "ANDROID_HOME=[$ANDROID_HOME]  ANDROID_SDK_ROOT=[$ANDROID_SDK_ROOT]"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK"
            exit 1
          fi
          echo "使用 SDK：$SDK"
          ls "$SDK"
          if [ ! -d "$SDK/tools" ] && [ ! -d "$SDK/bin" ]; then
            sudo ln -sfn "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
            echo "已补软链：$SDK/bin → cmdline-tools/latest/bin"
          fi
          ls -l "$SDK/bin/sdkmanager"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - name: 接受许可证 + 装构建所需组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # 工程 compileSdk/targetSdk = 36；bubblewrap 这个版本硬编码要 build-tools 36.1.0
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0" || true
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true
          bubblewrap doctor || true

      - name: 写入版本号（versionCode 递增才允许覆盖安装）
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('../package.json', 'utf8'));
          const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
          m.appVersionName = pkg.version;
          m.appVersion = pkg.version;
          m.appVersionCode = Number(process.env.RUN_NUMBER);
          fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2) + '\n');
          console.log(`版本：${m.appVersionName}（code ${m.appVersionCode}）`);
          NODE

      - name: 构建并签名 APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation \
            --signingKeyPath="$GITHUB_WORKSPACE/android-signing/notice-radar.p12" \
            --signingKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: 校验产物（签名、包名、体积）
        id: pack
        run: |
          APK=$(find android/app/build/outputs -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::没找到 APK"; exit 1; fi
          cp "$APK" notice-radar.apk
          ls -lh notice-radar.apk

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          echo "--- 签名校验 ---"
          "$APKSIGNER" verify --print-certs notice-radar.apk | head -8 || true

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          echo "--- 包信息 ---"
          unzip -l notice-radar.apk | head -8

          SHA=$(sha256sum notice-radar.apk | cut -d' ' -f1)
          SIZE=$(du -h notice-radar.apk | cut -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Android APK 构建成功"
            echo ""
            echo "- 大小：$SIZE"
            echo "- sha256：\`$SHA\`"
            echo "- 下载：https://github.com/${{ github.repository }}/releases/download/android-latest/notice-radar.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 Release（滚动标签 android-latest，下载链接固定）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest \
              --title "Android 安装包（滚动更新）" \
              --notes "下载 **notice-radar.apk** 安装即可（首次需在系统设置里允许安装未知来源应用）。这个 Release 每次构建都会被覆盖，下载地址固定不变。" \
              --prerelease
          gh release upload android-latest notice-radar.apk --clobber
          echo "已发布：https://github.com/${{ github.repository }}/releases/download/android-latest/notice-radar.apk"

      - name: 上传 APK 作为构建产物（保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: notice-radar-apk
          path: notice-radar.apk
          retention-days: 90
