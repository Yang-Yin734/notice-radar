name: android-apk

# 构建**自带界面的独立 Android 应用**（不再是 TWA 套壳）：
#   - 网页界面与数据被打包进 APK（assets/www），打开不需要网络、没有地址栏、不跳浏览器
#   - 数据先读内置，再按镜像顺序尝试刷新（github.io 在国内经常不通）
#   - 直接 Gradle 构建（不再依赖 bubblewrap），用固定密钥签名后发布到滚动 Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'src/dashboard.ts'
      - 'tools/prepare-android-assets.mjs'
      - 'tools/android-version.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

# 所有 APK 构建串行：分支推送与 tag 推送可能同时触发，两个运行都往同一个滚动 Release
# 上传 notice-radar.apk 会撞车（实见过 HTTP 422 ReleaseAsset.name already exists）
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: 生成应用界面与数据（随后被打包进 APK）
        run: |
          node src/cli.ts dashboard
          node tools/prepare-android-assets.mjs

      - name: 准备签名密钥
        run: |
          mkdir -p android-signing
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-signing/notice-radar.p12
          echo "keystore 大小：$(stat -c%s android-signing/notice-radar.p12) 字节"
          keytool -list -keystore android-signing/notice-radar.p12 -storetype PKCS12 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | tail -2

      - name: 写入版本号（versionCode 递增才允许覆盖安装）
        run: node tools/android-version.mjs --version-code="${{ github.run_number }}"

      - name: 接受许可证 + 装构建所需组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true

      - name: 构建 APK（Gradle）
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # 把错误摘要发成提交评论：Actions 日志在 Azure Blob 上，有些网络环境拿不到，
            # 提交评论走 api.github.com，哪里都能查
            {
              echo "Android 构建失败（${{ github.sha }}）"
              echo ''
              echo '```'
              grep -E 'e: file|error:|FAILURE|What went wrong|Caused by|Unresolved|Execution failed|Could not|BUILD FAILED' /tmp/gradle.log | head -50
              echo '```'
            } > /tmp/comment.md
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/comment.md >/dev/null 2>&1 || true
            echo "::error::Gradle 构建失败，错误摘要已作为提交评论发出"
            exit 1
          fi

      - name: 签名 + 校验产物
        id: pack
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)
          echo "build-tools：$BT"
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          [ -n "$UNSIGNED" ] || { echo "::error::没找到未签名 APK"; ls -R android/app/build/outputs || true; exit 1; }
          ls -lh "$UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks android-signing/notice-radar.p12 --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out notice-radar.apk aligned.apk
          echo "--- 签名 ---"
          "$BT/apksigner" verify --print-certs notice-radar.apk | head -6
          echo "--- 包信息 ---"
          BADGING=$("$BT/aapt2" dump badging notice-radar.apk | head -1)
          echo "$BADGING"
          case "$BADGING" in
            *"package: name='io.github.yangyin734.noticeradar'"*) echo "✓ 包名正确" ;;
            *) echo "::error::包名不对：$BADGING"; exit 1 ;;
          esac
          echo "--- 内置数据是否真的在包里（决定能否离线打开）---"
          unzip -l notice-radar.apk | grep -E 'assets/data/(dashboard-data\.json|version\.json)' || {
            echo "::error::APK 里没有内置数据，装出来会是空列表"
            exit 1
          }
          echo "  内置数据条数：$(unzip -p notice-radar.apk assets/data/dashboard-data.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).items.length))")"
          echo "--- 镜像数据源是否编译进代码（国内可达性）---"
          if unzip -p notice-radar.apk classes.dex | grep -aq 'jsdelivr'; then
            echo "✓ 镜像地址已在代码里"
          else
            echo "::error::dex 里没有镜像地址，国内将无法刷新数据"
            exit 1
          fi
          echo "--- 界面是否为原生（不应再有网页资源）---"
          if unzip -l notice-radar.apk | grep -q 'assets/www/'; then
            echo "::error::APK 里还残留 assets/www（网页界面），说明还在用 WebView 版本"
            exit 1
          fi
          echo "✓ 没有 assets/www，界面是原生的"
          SHA=$(sha256sum notice-radar.apk | cut -d' ' -f1)
          SIZE=$(du -h notice-radar.apk | cut -f1)
          CERT=$("$BT/apksigner" verify --print-certs notice-radar.apk | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Android 独立应用构建成功"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 大小 | $SIZE |"
            echo "| sha256 | \`$SHA\` |"
            echo "| 签名证书 SHA-256 | \`$CERT\` |"
            echo "| 界面资源 | 已打包进 APK（断网可打开、无地址栏） |"
            echo ""
            echo "下载：https://github.com/${{ github.repository }}/releases/download/android-latest/notice-radar.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 Release（滚动标签 android-latest，下载链接固定）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest \
              --title "Android 独立应用（滚动更新）" \
              --notes "下载 **notice-radar.apk** 安装即可（首次需在系统设置里允许安装未知来源应用）。界面与数据已打包在应用内：打开不需要联网，也不会跳浏览器。" \
              --prerelease || true
          # 并发构建撞车时 GitHub 会回 422（同名资产已存在），退避重试几次
          for attempt in 1 2 3 4 5; do
            if gh release upload android-latest notice-radar.apk --clobber; then
              echo "✓ 已发布（第 ${attempt} 次尝试）"
              echo "下载地址：https://github.com/${{ github.repository }}/releases/download/android-latest/notice-radar.apk"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次上传失败（可能是并发构建撞车），$((attempt * 10)) 秒后重试"
            sleep $((attempt * 10))
          done
          echo "::error::多次重试仍无法上传 APK"
          exit 1

      - name: 上传 APK 作为构建产物（保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: notice-radar-apk
          path: notice-radar.apk
          retention-days: 90
