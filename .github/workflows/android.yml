name: android-apk

# 把 PWA 打包成**可以下载安装的 Android APK**（TWA：Trusted Web Activity —— 本质是套壳的原生应用，
# 打开的就是同一个网址，但能进桌面图标列表、点开即用、不用手动"添加到主屏幕"）。
#
# 为什么在 CI 里打：本地要装 JDK + Android SDK（1GB+），runner 上现成。
# 签名密钥来自 Secrets（同一把密钥才能覆盖安装，见 tools/make-android-keystore.mjs）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: 准备签名密钥
        run: |
          mkdir -p android-signing
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-signing/notice-radar.p12
          echo "keystore 大小：$(stat -c%s android-signing/notice-radar.p12) 字节"
          keytool -list -keystore android-signing/notice-radar.p12 -storetype PKCS12 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | tail -3

      - name: 安装 bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: 接受 Android SDK 许可（缺失的组件顺手装上）
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: 生成 TWA 工程
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bubblewrap init \
            --manifest=https://yang-yin734.github.io/notice-radar/manifest.webmanifest \
            --directory=android-app \
            --name="校园通知雷达" \
            --shortName="通知雷达" \
            --launcherName="通知雷达" \
            --packageId=io.github.yangyin734.noticeradar \
            --appVersion="$VERSION" \
            --appVersionCode="${{ github.run_number }}" \
            --startUrl=/notice-radar/ \
            --iconUrl=https://yang-yin734.github.io/notice-radar/icon-512.png \
            --maskableIconUrl=https://yang-yin734.github.io/notice-radar/icon-512.png \
            --themeColor=#1f2a3d \
            --backgroundColor=#eef1f6 \
            --display=standalone \
            --orientation=portrait-primary \
            --enableNotifications=false \
            --enableSiteSettingsShortcut=true \
            --fallbackType=customtabs \
            --minSdkVersion=23 \
            --signingKeyPath="$PWD/android-signing/notice-radar.p12" \
            --signingKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            --skipPwaValidation

      - name: 构建 APK
        working-directory: android-app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: 检查产物
        run: |
          APK=$(find android-app -name '*.apk' -type f | head -1)
          echo "APK=$APK"
          ls -lh "$APK"
          cp "$APK" notice-radar.apk
          echo "sha256=$(sha256sum notice-radar.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "### APK 构建成功" >> "$GITHUB_STEP_SUMMARY"
          echo "- 大小：$(du -h notice-radar.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256：$(sha256sum notice-radar.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          unzip -l notice-radar.apk | head -12
          if [ -f android-app/assetlinks.json ]; then
            echo "--- Bubblewrap 生成的 assetlinks.json ---"
            cat android-app/assetlinks.json
          fi
        id: pack

      - name: 发布到 Release（滚动标签 android-latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest \
              --title "Android 安装包（滚动更新）" \
              --notes "直接下载 notice-radar.apk 安装即可。这个 Release 每次构建都会被覆盖更新，下载链接固定不变。" \
              --prerelease
          gh release upload android-latest notice-radar.apk --clobber
          echo "### 下载地址" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/android-latest/notice-radar.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK 作为构建产物（保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: notice-radar-apk
          path: notice-radar.apk
          retention-days: 90
