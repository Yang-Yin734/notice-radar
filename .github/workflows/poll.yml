name: poll

# 定时抓取。GitHub Actions 的 cron 用 UTC，最小间隔 5 分钟；
# 实际执行会排队延迟几分钟，所以别指望"秒级"。
# 注意：仓库 60 天没有任何提交活动时，GitHub 会自动停用定时任务（在 Actions 页面会提示）。
on:
  schedule:
    - cron: '*/20 * * * *'
  # 改了源配置推上来立刻验证一次，不必等定时；首次部署也能马上确认权限是否配好。
  # 限定 paths，避免每次改文档都触发一轮；状态提交带 [skip ci]，不会形成循环。
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/poll.yml'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # 防止某个源卡住导致 job 一直挂着（默认上限是 6 小时，太宽松）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 抓取并推送
        id: fetch
        env:
          # 在想用这个仓库的人自己的 Settings → Secrets 里配
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          # 境内学校站点在境外 runner 上偶发整体不可达（跨境网络抖动，实测约每 3 次 1 次）。
          # 单源失败不影响退出码，只有全部源都失败才返回非零，所以重试放在这一层。
          for attempt in 1 2 3 4; do
            if node src/cli.ts run --json=data/latest.json --delay=1500; then
              echo "outcome=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              wait=$((attempt * 20 + 10))   # 30 / 50 / 70 秒
              echo "::warning::第 ${attempt} 次抓取失败（可能所有源都不可达），${wait} 秒后重试"
              sleep "$wait"
            fi
          done
          # 这里不直接判红：到底算"网络天气"还是"真故障"，交给下一步按连续次数决定
          echo "outcome=fail" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 故障判定（连续 3 次全失败才报红）
        run: node tools/health.ts --outcome=${{ steps.fetch.outputs.outcome }}

      - name: 失败时打印体检表（便于定位）
        if: failure()
        run: node src/cli.ts doctor --delay=1500 || true

      - name: 提交状态（下次只报新增）
        run: |
          git config user.name "notice-radar-bot"
          git config user.email "notice-radar-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore(state): $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            if git push; then
              echo "✓ 状态已提交回仓库"
            else
              echo "::error::推送状态失败。多半是仓库把 GITHUB_TOKEN 设成了只读：Settings → Actions → General → Workflow permissions → 选 Read and write permissions"
              exit 1
            fi
          fi
