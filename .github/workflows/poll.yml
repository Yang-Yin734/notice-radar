name: poll

# 定时抓取。GitHub Actions 的 cron 用 UTC，最小间隔 5 分钟；
# 实际执行会排队延迟几分钟，所以别指望"秒级"。
# 注意：仓库 60 天没有任何提交活动时，GitHub 会自动停用定时任务（在 Actions 页面会提示）。
#
# 为什么是 10 分钟（而不是更保守的 20 分钟）：
#   境外 runner 到国内教育网站点实测单轮成功率只有四成左右，且**通知不会丢、只会晚**
#   （状态只在成功时写入，成功那轮会补抓全量列表，所以漏掉的下一轮就补上）。
#   把频率翻倍，一小时内"至少成功一次"的概率从 ≈78% 提到 ≈95%，延迟显著下降。
#   ⚠️ 公共仓库的 Actions 分钟数不计费，所以这对公开仓库是零成本；
#      若你把本仓库改成私有，288 次/天会很快吃掉私有仓库的免费额度，请把间隔调回 20 或 30 分钟。
#
# ⚠ 两地部署开关 —— 只在「境内常驻节点已经接管通知」之后才动，步骤见 deploy/README.md 第 6 步：
#   1) 下面这行 cron 放宽成 '*/30 * * * *'（推送不再走这里，数据晚半小时无所谓）
#   2) 下面「抓取并推送」那步的 run 加上 --no-notify
#   两处都要改：只改一处会出现「同一条通知推两次」或「一次都不推」。
on:
  schedule:
    - cron: '*/10 * * * *'
  # 改了源配置推上来立刻验证一次，不必等定时；首次部署也能马上确认权限是否配好。
  # 限定 paths，避免每次改文档都触发一轮；状态提交带 [skip ci]，不会形成循环。
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/poll.yml'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # 防止某个源卡住导致 job 一直挂着（默认上限是 6 小时，太宽松）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 开工前先同步远端：本地与云端都会重建 docs 下的产物，不同步就必然撞车。
      # 冲突时用 -X ours 自动以本地为准（产物由本次构建重新生成，不该做文本合并）。
      - name: 同步远端状态
        run: |
          git config merge.ours.driver true
          git fetch origin main
          git merge -X ours --no-edit origin/main || { echo "::warning::同步失败，继续（提交时会再试）"; git merge --abort || true; }

      # 国内出口优先：本机 `tools\run-daily.ps1 -Push` 或境内部署（deploy/）抓到东西后会推回 main，
      # 并在 data/poller.json 记下时间戳。20 分钟内刚有人跑过，说明通知已经从国内发出去了，
      # 本轮的跨境抓取只会白耗掉 15 分钟超时、还可能重复推一次 —— 直接让路。
      # 本机停机超过 20 分钟，这里就自动接管，不需要人工切换。
      - name: 境内节点刚跑过就让路
        id: outlet
        run: |
          node -e "
            const fs = require('fs');
            let at = 0;
            try { at = Date.parse(JSON.parse(fs.readFileSync('data/poller.json', 'utf8')).at || ''); } catch (e) {}
            const mins = at ? Math.round((Date.now() - at) / 60000) : -1;
            const fresh = mins >= 0 && mins < 20;
            console.log('境内节点最后跑过：' + (mins < 0 ? '没有记录' : mins + ' 分钟前') + (fresh ? ' → 本轮让路' : ' → 本轮照常抓取'));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'skip=' + (fresh ? 'yes' : 'no') + '\n');
          "

      - name: 抓取并推送
        id: fetch
        if: steps.outlet.outputs.skip != 'yes'
        env:
          # 推送凭据（可选）：在想用这个仓库的人自己的 Settings → Secrets 里配。
          # 不配也没有远端通道，通知照常进归档/仪表盘，只是不会主动发出去。
          NOTICE_RADAR_WEBHOOK: ${{ secrets.NOTICE_RADAR_WEBHOOK }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          # 境内学校站点在境外 runner 上偶发整体不可达（跨境网络抖动，实测约每 3 次 1 次）。
          # 单源失败不影响退出码，只有全部源都失败才返回非零，所以重试放在这一层。
          # 6 次 + 逐步拉长间隔：尽量"抖过去"，让通知晚到一点而不是丢掉（状态没写，成功那轮会补发）。
          # --timeout=15000：跨境链路常是"连上了但迟迟不回"，默认 40s 会让整轮撞上 15 分钟的 job 上限，
          #   砍到 15s 让这种源快速失败进重试，而不是把后面所有源一起拖死。
          # --concurrency=4：4 个 worker 并行领号，整轮耗时从"30 源 × 平均耗时"压到约 1/4；
          #   源之间仍保留 1500ms 间隔（首轮按 worker 序号错开），对学校站点保持客气。
          for attempt in 1 2 3 4 5 6; do
            if node src/cli.ts run --json=data/latest.json --delay=1500 --timeout=15000 --concurrency=4; then
              echo "outcome=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              wait=$((attempt * 30))   # 30 / 60 / 90 / 120 / 150 秒
              echo "::warning::第 ${attempt} 次抓取失败（可能所有源都不可达），${wait} 秒后重试"
              sleep "$wait"
            fi
          done
          # 这里不直接判红：到底算"网络天气"还是"真故障"，交给下一步按连续次数决定
          echo "outcome=fail" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 故障判定（连续 3 次全失败才报红）
        if: steps.outlet.outputs.skip != 'yes'
        run: node tools/health.ts --outcome=${{ steps.fetch.outputs.outcome }}

      - name: 抓取其它学校（只采集不通知）
        # 全国名单里陆续接入的学校：各自的预设里都标了 collectOnly ——
        # 条目照常进归档、仪表盘与按校数据文件（docs/data/schools/<id>.json），
        # 但不推送、不进日报。
        #
        # 为什么用 always()：主抓取失败**不代表**别的学校抓不到 —— 电子科技大学在教育网，
        # 另外几所在商用网，实测出现过"uestc 5 个源全挂、西南财经大学照常 10 条"的情况。
        # 这几所都是 collectOnly：抓不到只记 warning，不影响主链路、不影响 CI 结论。
        if: always() && steps.outlet.outputs.skip != 'yes'
        run: |
          shopt -s nullglob
          for cfg in config/schools/*.yaml; do
            case "$cfg" in
              *uestc.yaml|*uestc-math.yaml) continue ;;   # 主链路已经抓过
            esac
            echo "▸ 其它学校：$cfg"
            node src/cli.ts run --config="$cfg" --delay=1500 || \
              echo "::warning::$cfg 抓取失败（collectOnly，不影响主链路）"
          done

      - name: 失败时打印体检表（便于定位）
        if: failure()
        run: node src/cli.ts doctor --delay=1500 || true

      - name: 重建通知归档仪表盘（GitHub Pages）
        if: steps.outlet.outputs.skip != 'yes'
        run: |
          node src/cli.ts dashboard
          # 同时重建"学校目录 + 按校拆分的数据"（网页/应用的选校功能读它）
          node tools/build-schools.mjs

      - name: 配置状态推送密钥
        # main 受规则集保护（必须走 PR），但定时抓取要把 data/ 与 docs/ 写回 main。
        # 解决办法：用一把「部署密钥」推送，它在保护规则里是白名单成员。
        # 没有配 STATE_DEPLOY_KEY 时保持原样（用 GITHUB_TOKEN），不影响已有部署。
        if: always() && steps.outlet.outputs.skip != 'yes'
        env:
          STATE_DEPLOY_KEY: ${{ secrets.STATE_DEPLOY_KEY }}
        run: |
          if [ -z "$STATE_DEPLOY_KEY" ]; then
            echo "没有 STATE_DEPLOY_KEY，沿用 GITHUB_TOKEN 推送"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$STATE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "已改用部署密钥推送"

      - name: 提交状态（下次只报新增）+ 仪表盘
        # ⚠ 必须 always()：故障判定报红时本步骤原本被跳过 → data/health.json 里
        # 「连续失败次数 + reported」永远存不下来 → 下一次运行又从旧计数+1 再红一次，
        # 于是跨境网络抖动期间每 10 分钟一封失败邮件（"每个故障期只红一次"的设计失效）。
        # 带上 always() 后：报红那一轮会把计数与 reported 落盘，后续轮次自动静默到恢复；
        # 顺带把失败轮的 data/runs.json 也留下（自适应阈值要靠它算成功率）。
        # 抓取失败时 data/state.json 本来就不会被写，所以这里不会提交"半个状态"。
        if: always() && steps.outlet.outputs.skip != 'yes'
        run: |
          git config user.name "notice-radar-bot"
          git config user.email "notice-radar-bot@users.noreply.github.com"
          git config merge.ours.driver true
          git add -A data docs
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(state): $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # 先合并远端再推：docs 下是构建产物，冲突必须自动解决（-X ours），
          # 绝不能让 <<<<<<< 这类冲突标记被提交上去（曾经这么坏过线上页面）
          git fetch origin main
          if ! git merge -X ours --no-edit origin/main; then
            git merge --abort || true
            echo "::error::与远端合并失败，本次不提交（下次运行会重试）"
            exit 1
          fi
          if git push; then
            echo "✓ 状态已提交回仓库"
          else
            echo "::error::推送状态失败。查两处：① Settings → Actions → General → Workflow permissions 要为 Read and write；② 若开了 main 保护规则，Secret STATE_DEPLOY_KEY 必须与规则白名单里的部署密钥配对"
            exit 1
          fi
