name: poll

# 定时抓取。GitHub Actions 的 cron 用 UTC，最小间隔 5 分钟；
# 实际执行会排队延迟几分钟，所以别指望"秒级"。
# 注意：仓库 60 天没有任何提交活动时，GitHub 会自动停用定时任务（在 Actions 页面会提示）。
#
# 为什么是 10 分钟（而不是更保守的 20 分钟）：
#   境外 runner 到国内教育网站点实测单轮成功率只有四成左右，且**通知不会丢、只会晚**
#   （状态只在成功时写入，成功那轮会补抓全量列表，所以漏掉的下一轮就补上）。
#   把频率翻倍，一小时内"至少成功一次"的概率从 ≈78% 提到 ≈95%，延迟显著下降。
#   ⚠️ 公共仓库的 Actions 分钟数不计费，所以这对公开仓库是零成本；
#      若你把本仓库改成私有，288 次/天会很快吃掉私有仓库的免费额度，请把间隔调回 20 或 30 分钟。
on:
  schedule:
    - cron: '*/10 * * * *'
  # 改了源配置推上来立刻验证一次，不必等定时；首次部署也能马上确认权限是否配好。
  # 限定 paths，避免每次改文档都触发一轮；状态提交带 [skip ci]，不会形成循环。
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/poll.yml'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    # 应用里的「微信推送」开关就是改这个仓库变量（Settings → Secrets and variables → Actions → Variables）。
    # 关掉后整个 job 直接跳过，连抓取都不做 —— 不消耗额度，也不会有误推。
    if: vars.PUSH_ENABLED != 'false'
    runs-on: ubuntu-latest
    # 防止某个源卡住导致 job 一直挂着（默认上限是 6 小时，太宽松）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 开工前先同步远端：本地与云端都会重建 docs 下的产物，不同步就必然撞车。
      # 冲突时用 -X ours 自动以本地为准（产物由本次构建重新生成，不该做文本合并）。
      - name: 同步远端状态
        run: |
          git config merge.ours.driver true
          git fetch origin main
          git merge -X ours --no-edit origin/main || { echo "::warning::同步失败，继续（提交时会再试）"; git merge --abort || true; }

      - name: 抓取并推送
        id: fetch
        env:
          # 在想用这个仓库的人自己的 Settings → Secrets 里配
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          # 境内学校站点在境外 runner 上偶发整体不可达（跨境网络抖动，实测约每 3 次 1 次）。
          # 单源失败不影响退出码，只有全部源都失败才返回非零，所以重试放在这一层。
          # 6 次 + 逐步拉长间隔：尽量"抖过去"，让通知晚到一点而不是丢掉（状态没写，成功那轮会补发）。
          for attempt in 1 2 3 4 5 6; do
            if node src/cli.ts run --json=data/latest.json --delay=1500; then
              echo "outcome=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              wait=$((attempt * 30))   # 30 / 60 / 90 / 120 / 150 秒
              echo "::warning::第 ${attempt} 次抓取失败（可能所有源都不可达），${wait} 秒后重试"
              sleep "$wait"
            fi
          done
          # 这里不直接判红：到底算"网络天气"还是"真故障"，交给下一步按连续次数决定
          echo "outcome=fail" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 故障判定（连续 3 次全失败才报红）
        run: node tools/health.ts --outcome=${{ steps.fetch.outputs.outcome }}

      - name: 失败时打印体检表（便于定位）
        if: failure()
        run: node src/cli.ts doctor --delay=1500 || true

      - name: 重建通知归档仪表盘（GitHub Pages）
        run: |
          node src/cli.ts dashboard
          # 同时重建"学校目录 + 按校拆分的数据"（网页/应用的选校功能读它）
          node tools/build-schools.mjs

      - name: 提交状态（下次只报新增）+ 仪表盘
        run: |
          git config user.name "notice-radar-bot"
          git config user.email "notice-radar-bot@users.noreply.github.com"
          git config merge.ours.driver true
          git add -A data docs
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(state): $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # 先合并远端再推：docs 下是构建产物，冲突必须自动解决（-X ours），
          # 绝不能让 <<<<<<< 这类冲突标记被提交上去（曾经这么坏过线上页面）
          git fetch origin main
          if ! git merge -X ours --no-edit origin/main; then
            git merge --abort || true
            echo "::error::与远端合并失败，本次不提交（下次运行会重试）"
            exit 1
          fi
          if git push; then
            echo "✓ 状态已提交回仓库"
          else
            echo "::error::推送状态失败。多半是仓库把 GITHUB_TOKEN 设成了只读：Settings → Actions → General → Workflow permissions → 选 Read and write permissions"
            exit 1
          fi
