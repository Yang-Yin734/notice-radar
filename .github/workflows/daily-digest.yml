name: daily-digest

# 每天早上 8 点（北京时间）把「昨天的新通知」合成一条日报消息（走 notify 里启用的通道）。
#
# 为什么要有它：poll 每 20 分钟发现新通知就推一次，期中期末手机上很吵。
# 现在分工是：命中急事关键词（选课/退课/缓考试/推免/奖学金…）的由 poll 立刻推，
# 其余全部留到这里汇总成一条 —— 见配置里的 push.urgent 与 push.digestRest。
#
# 手动触发默认「只预览不发送」：渲染结果会作为**提交评论**发出来，
# 因为在部分网络环境里 Actions 日志（存在 Azure Blob）拿不到，提交评论能拿到。
on:
  schedule:
    - cron: '5 0 * * *' # 00:05 UTC = 08:05 北京
  workflow_dispatch:
    inputs:
      date:
        description: 指定日期（YYYY-MM-DD，留空=昨天北京时间）
        required: false
        default: ''
      dry:
        description: 只预览不发送（结果发成提交评论）
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 预览（不发送，结果发成提交评论）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date=${{ github.event.inputs.date }}"; fi
          node src/cli.ts digest $ARGS > preview.txt 2>&1 || true
          {
            echo "### 日报预览（**未发送**）"
            echo ""
            echo '```'
            head -100 preview.txt
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null 2>&1 || true
          echo "预览已发成提交评论（没有推送任何消息）"
          {
            echo "### 日报预览（未发送）"
            echo ""
            echo '```'
            head -60 preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发送日报（定时任务，或手动 dry=false）
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry == 'false'
        env:
          NOTICE_RADAR_WEBHOOK: ${{ secrets.NOTICE_RADAR_WEBHOOK }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # pipefail 很关键：不然 `| tee` 会让发送失败的退出码被吃掉，步骤照样是绿的
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date=${{ github.event.inputs.date }}"; fi
          set +e
          node src/cli.ts digest --notify $ARGS 2>&1 | tee digest-out.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### 日报已处理（$(date -u '+%Y-%m-%d %H:%M UTC')）"
            echo ""
            echo '```'
            tail -12 digest-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            {
              echo "日报发送失败（${{ github.sha }}）"
              echo ""
              echo '```'
              tail -30 digest-out.txt
              echo '```'
            } > comment.md
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null 2>&1 || true
            echo "::error::日报发送失败，原因已发成提交评论"
            exit 1
          fi
