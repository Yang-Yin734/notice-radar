# 郑州大学（zzu）—— 全国名单里第十四所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务部「通知公告」列表页，条目是
#   <li><a href="../info/1125/5405.htm" class="flex wl">
#     <h3 class="l1 txt1">关于举办…的通知</h3><span>2026-09-30</span></a></li>
# 关键点：标题必须取 **h3** —— 取 a 的文本会把日期一起并进标题。
school: zzu
name: 郑州大学

sources:
  - id: jwc-tzgg
    name: 教务部·通知公告
    url: https://www5.zzu.edu.cn/jwc/index/tzgg.htm
    adapter: html-list
    baseUrl: https://www5.zzu.edu.cn/jwc/index/tzgg.htm
    collectOnly: true
    note: 竞赛、国创计划、选课一类通知；标题取 h3（取 a 文本会带上日期），日期取 span
    selectors:
      item: .list li
      title: h3
      link: a@href
      date: span
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 竞赛
      - 国创
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
