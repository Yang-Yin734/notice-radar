# 北京航空航天大学（buaa）—— 全国名单里第七所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务部「通知公告 → 学生专区」；每条是
#   <div class="n_bt"><ul><li><a href="../info/1016/9194.htm">
#     <h5 class="reveal1">标题</h5><i>2026.09.29</i></a></li>
# 关键点：标题取 **h5**（取 a 的文本会把日期一起并进标题），日期取 i（形如 2026.09.29）。
school: buaa
name: 北京航空航天大学

notify:
  - type: serverchan
    keyEnv: SERVERCHAN_KEY

sources:
  - id: jiaowu-xszq
    name: 教务部·通知公告（学生专区）
    url: https://jiaowu.buaa.edu.cn/tzgg/xszq.htm
    adapter: html-list
    baseUrl: https://jiaowu.buaa.edu.cn/tzgg/xszq.htm
    collectOnly: true
    note: 竞赛报名、选课、考试一类落在这里；标题取 h5，日期取 i
    selectors:
      item: div.n_bt ul li
      title: h5
      link: a@href
      date: i
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 竞赛
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
