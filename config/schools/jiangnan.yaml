# 江南大学（jiangnan）—— 全国名单里第七所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务处「教务管理 → 通知公告」列表页，每条 li 里 a[title] 是完整标题、span 是日期。
# 用 tools/probe-batch.mjs 一次筛出来的（本轮 20 所候选里 2 所可接）。
school: jiangnan
name: 江南大学

notify:
  - type: serverchan
    keyEnv: SERVERCHAN_KEY

sources:
  - id: jwc-tzgg
    name: 教务处·通知公告
    url: https://jwc.jiangnan.edu.cn/jwgl/tzgg.htm
    adapter: html-list
    baseUrl: https://jwc.jiangnan.edu.cn/jwgl/tzgg.htm
    collectOnly: true
    note: 通识选修课、辅修、选课退课一类通知都在这里；标题取 a@title（完整），日期取 span
    selectors:
      item: .main-list li
      title: a@title
      link: a@href
      date: span
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 辅修
      - 通识
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
