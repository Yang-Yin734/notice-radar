# 厦门大学（xmu）—— 全国名单里第十二所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务处「通知公告」列表页；条目在 .list 里，标题在 a 的 title 属性，日期在 span.date。
# 说明：教务处首页**没有**"通知公告"导航链接（导航是 JS 驱动的），
# 所以自动探测找不到入口 —— 直接给列表页地址 `jwc.xmu.edu.cn/tzgg.htm` 反而最快。
school: xmu
name: 厦门大学

notify:
  - type: serverchan
    keyEnv: SERVERCHAN_KEY

sources:
  - id: jwc-tzgg
    name: 教务处·通知公告
    url: https://jwc.xmu.edu.cn/tzgg.htm
    adapter: html-list
    baseUrl: https://jwc.xmu.edu.cn/tzgg.htm
    collectOnly: true
    note: 转专业、选课、创新训练计划名单一类通知；标题取 a@title，日期取 span.date
    selectors:
      item: .list li
      title: a@title
      link: a@href
      date: span.date
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 创新训练
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
