# 华中科技大学（hust）—— 全国名单里第四所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：本科生院的 <div class="list"> 里，每条 li 是
#   <a href="info/..."><h2>完整标题</h2><div class="zhai" style="display:none">正文摘要</div></a>
#   <span class="fr">2026-09-30</span>
# 关键点：标题取 **h2**（干净），不要取 a 的文本 —— 那样会把隐藏的正文摘要一起抓进来。
school: hust
name: 华中科技大学

sources:
  - id: ugs-tzgg
    name: 本科生院·通知公告
    url: https://ugs.hust.edu.cn/tzgg.htm
    adapter: html-list
    baseUrl: https://ugs.hust.edu.cn/tzgg.htm
    collectOnly: true
    note: 实验班选拔/选课/学籍/毕业一类都在这；标题取 h2，日期取 span.fr
    selectors:
      item: .list li
      title: h2
      link: a@href
      date: span.fr
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 实验班
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
