# 西北工业大学（nwpu）—— 全国名单里第八所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务部「教学信息 → 通知公告」，条目在 .list 里，日期在 span。
# 这一所的入口是"按可信度排序"之后才找对的：教务部首页里"更多/MORE"链接很多，
# 按文档顺序取前几个会选到别的栏目（详见 CHANGELOG v0.10.18）。
school: nwpu
name: 西北工业大学

sources:
  - id: jiaowu-tzgg
    name: 教务部·通知公告
    url: https://jiaowu.nwpu.edu.cn/jxxx1/tzgg.htm
    adapter: html-list
    baseUrl: https://jiaowu.nwpu.edu.cn/jxxx1/tzgg.htm
    collectOnly: true
    note: 竞赛选拔、报名、公示、学籍考试一类通知；标题取 a，日期取 span
    selectors:
      item: .list li
      title: a
      link: a@href
      date: span
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 竞赛
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
