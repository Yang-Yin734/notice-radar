# 中国海洋大学（ouc）—— 全国名单里第十一所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务处「通知公告」用的是博达（Boda）CMS 的标准列表：
#   <li class="list_item"> … <span class="Article_Title"><a href=… title=…>标题</a></span>
#                          <span class="Article_PublishDate">2026-09-30</span>
# 关键点：博达的日期类名是 `Article_PublishDate`（不是常见的 span.date），
# 所以自动探测一开始报"这页没有日期"。
school: ouc
name: 中国海洋大学

sources:
  - id: jwc-tzgg
    name: 教务处·通知公告
    url: https://jwc.ouc.edu.cn/6517/list.htm
    adapter: html-list
    baseUrl: https://jwc.ouc.edu.cn/6517/list.htm
    collectOnly: true
    note: 博达 CMS；标题取 .Article_Title a@title，日期取 .Article_PublishDate
    selectors:
      item: li.list_item
      title: .Article_Title a@title
      link: a@href
      date: .Article_PublishDate
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
