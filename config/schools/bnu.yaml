# 北京师范大学（bnu）—— 全国名单里第十六所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务部「通知公告」列表页，条目是
#   <div class="article-list"><div class="boxlist"><ul><li>
#     <a href="…"><span>【实践教学】关于…的通知</span></a>
#     <span class="fr text-muted">2026-09-30</span></li></ul></div></div>
# 关键点：日期取 **.text-muted**（页面里 `span` 太多，笼统取 span 会把标题本身当日期 ——
# 自动探测当时只认出 5/20 条日期就是这么来的）。
school: bnu
name: 北京师范大学

sources:
  - id: jwb-tzgg
    name: 教务部·通知公告
    url: https://jwb.bnu.edu.cn/tzgg/index.htm
    adapter: html-list
    baseUrl: https://jwb.bnu.edu.cn/tzgg/index.htm
    collectOnly: true
    note: 实践教学、选课、学籍一类通知；标题取 a span，日期取 .text-muted
    selectors:
      item: .article-list li
      title: a span
      link: a@href
      date: .text-muted
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 实践教学
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
