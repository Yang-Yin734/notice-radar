# 华东师范大学（ecnu）—— 全国名单里第十五所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：本科生院（博达 CMS 模板），条目是
#   <ul class="news_list"><li class="news …"><a href="…page.htm">
#     <div class="news_title">关于启动2027年春季学期国际交流项目（第二批）的选派通知</div>
#     <div class="news_date">2026-09-29</div></a></li>
# 关键点：标题取 **.news_title**、日期取 **.news_date** —— 取 a 的文本会把日期并进标题；
# 这页的日期类名是博达模板自己的 `.news_date`，不是常见的 `span.date`。
school: ecnu
name: 华东师范大学

sources:
  - id: bksy-tzgg
    name: 本科生院·通知公告
    url: https://bksy.ecnu.edu.cn/tzggwwxsgg/list.htm
    adapter: html-list
    baseUrl: https://bksy.ecnu.edu.cn/tzggwwxsgg/list.htm
    collectOnly: true
    note: 国际交流选派、教师培养计划一类通知；标题取 .news_title，日期取 .news_date
    selectors:
      item: ul.news_list li
      title: .news_title
      link: a@href
      date: .news_date
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 交流
      - 选派
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
