# 天津大学（tju）—— 全国名单里第六所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：本科生院「通知公告」列表页；标题在 **h2** 里（不是 a 的文本 —— 那样会带上正文摘要），
# 日期在 span 里。用 tools/try-selectors.mjs 探出来的（注意探测器一开始只试了 h3，漏了 h2，
# 补上 h2 之后这页才被正确识别）。
school: tju
name: 天津大学

sources:
  - id: oaa-tzgg
    name: 本科生院·通知公告
    url: https://oaa.tju.edu.cn/bszy/tzgg.htm
    adapter: html-list
    baseUrl: https://oaa.tju.edu.cn/bszy/tzgg.htm
    collectOnly: true
    note: 四六级报名、选课、学籍这类通知都在这里；标题取 h2
    selectors:
      item: ul li
      title: h2
      link: a@href
      date: span
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 报名通知
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
      - 征集活动
