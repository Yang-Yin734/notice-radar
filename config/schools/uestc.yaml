# 电子科技大学预设（M0 首个可用预设）
#
# 关于数学科学学院的通知：其官网部署了瑞数（RiverSecurity）类的 JS 机器人挑战，
# 无头浏览器会被识别并直接回 HTTP 400（实测 Edge 154 无头模式即被拒）。
# 因此该源用**可见浏览器窗口**渲染 —— 这只能在你自己机器上低频跑，
# GitHub Actions 上会被自动跳过（云端的无头环境过不去这道门，而本项目不做指纹伪装）。
# 详见 README「合规与边界」。
#
# 关键词只做子串匹配（大小写不敏感）。exclude 优先级高于 include。
# 注意：不要把「公示」整体放进 exclude —— 推免名单、奖学金评定结果都是公示形式。

school: uestc
name: 电子科技大学

notify:
  - type: serverchan
    keyEnv: SERVERCHAN_KEY
  - type: stdout

sources:
  - id: jwc-important
    name: 教务处·重要公告
    url: https://www.jwc.uestc.edu.cn/hard/?page=1
    adapter: uestc/jwc
    note: 全校政策类，选课/考试/学籍都从这里出
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 重新学习
      - 调课
      - 停课
      - 考试
      - 缓考
      - 补考
      - 成绩
      - 学籍
      - 注册
      - 学生证
      - 培养方案
      - 转专业
      - 大类分流
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 四六级
      - 竞赛
      - 建模
      - 数学
      - 大创
      - 微专业
      - 报名
      - 毕业
      - 学位
    exclude:
      - 中标
      - 成交
      - 招标
      - 采购
      - 询价
      - 竞争性磋商
      - 流标
      - 资产处置
      - 报废
      - 校友
      - 捐赠
      - 校庆
      - 巡察
