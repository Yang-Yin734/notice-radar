  # ===== 数学科学学院 =====
  # 这两条是本预设里唯一需要浏览器的源：本地运行时加 --allow-browser 才会抓。
  - id: math-jwgg
    name: 数学科学学院·教务公告
    url: https://www.math.uestc.edu.cn/tzgg1/jwgg.htm
    adapter: html-list
    requiresBrowser: true
    browserHeadless: false
    browserExpect: 数学
    # 列表里的链接是 ../info/... 形式，必须按「页面地址」而不是域名来解析
    baseUrl: https://www.math.uestc.edu.cn/tzgg1/jwgg.htm
    note: 学院自己的教务通知（推免细则、免听免修、讲座、毕设安排都在这里）
    selectors:
      item: div.ArticleList table tr
      title: td.fw_t a@title
      link: td.fw_t a@href
      date: td.fw_s
    include:
      - 推免
      - 保研
      - 免试
      - 免听
      - 免修
      - 选课
      - 退课
      - 补选
      - 重修
      - 考试
      - 补考
      - 缓考
      - 讲座
      - 竞赛
      - 建模
      - 数学建模
      - 奖学金
      - 荣誉
      - 学分
      - 毕业设计
      - 答辩
      - 助教
      - 成绩
      - 公示
      - 名单
      - 报名
      - 培养方案
      - 转专业
      - 分流
      - 微积分
      - 线性代数
      - 概率
