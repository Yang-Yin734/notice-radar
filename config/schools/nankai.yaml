# 南开大学（nankai）—— 全国名单里第十三所接入的学校。
#
# 状态：**只采集不通知**（collectOnly: true）。
#
# 站点结构：教务处「通知公告」列表页，条目是
#   <div class="item"><div class="d"><div class="d-d">30</div><div class="d-m">2026/09</div></div>
#     <div class="t"><a href="/2026/0930/c35436a603675/page.htm">标题</a></div></div>
# 日期在页面上被**拆成两块**（日 / 年月），没法直接解析；
# 但链接里带着 `/2026/0930/` —— 所以用 `dateFromLink` 从链接取日期（v0.10.19 新加的能力）。
school: nankai
name: 南开大学

notify:
  - type: serverchan
    keyEnv: SERVERCHAN_KEY

sources:
  - id: jwc-tzgg
    name: 教务处·通知公告
    url: https://jwc.nankai.edu.cn/tzgg/list.htm
    adapter: html-list
    baseUrl: https://jwc.nankai.edu.cn/tzgg/list.htm
    collectOnly: true
    note: 智慧书院录取名单、选课一类通知；日期从链接 /2026/0930/ 里取（页面把它拆成两块）
    selectors:
      item: div.item
      title: .t a
      link: a@href
      dateFromLink: '/(\d{4})/(\d{2})(\d{2})/'
    include:
      - 选课
      - 退课
      - 补选
      - 重修
      - 缓考
      - 补考
      - 考试
      - 四六级
      - 成绩
      - 学籍
      - 毕业
      - 学位
      - 推免
      - 保研
      - 奖学金
      - 助学金
      - 报名
      - 公示
      - 名单
      - 转专业
      - 书院
    exclude:
      - 招聘
      - 招标
      - 采购
      - 中标
      - 成交
      - 校友
      - 捐赠
